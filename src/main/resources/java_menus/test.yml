# Menu title (name shown at top when chest opens)
menu_title: "&6&lMain Menu &7| &fServer Name"

# Menu rows (must be 1, 2, 3, 4, 5, or 6)
# 1 row = 9 slots, 6 rows = 54 slots (full)
rows: 6

items:
  # The "server_info" here is the item ID, you can change it freely, just don't duplicate
  server_info:
    slot: 10 # Slot where icon displays
    material: KNOWLEDGE_BOOK # Note: Item material ID (must be a Minecraft vanilla ID) I recommend using MCwiki to look up
    display_name: "&e&lServer Info"     # Note: Item display name (supports color codes &)
    lore: # Note: Item description text (the lines shown when hovering)
      - "&7Click to view server information"
      - ""
      - "&fOnline Players: &a%server_online%&f/&a%server_max_players%"  # Common variables (requires PlaceholderAPI plugin):
      - "&fServer Version: &a%server_version%"
      - ""
      - "&eClick to view detailed information"
    left_click_commands: # Note: Series of actions executed when left-clicking (executed in order)
    # This can be replaced with right_click_commands  left is left click, right is right click
      - "[message] &6=== Server Information ===" # [message] = Send a chat message to the clicking player
      - "[player] list" # [player] = Make the player execute the following command (equivalent to player typing in chat)
      - "[close]" # [close] = Close menu after click
      # Options: player (player executes), cmd (console executes), message (send message), close (close menu)
      # Set the following items in the same way

  # Example Item 2: Teleport
  teleport_spawn:
    slot: 12
    material: COMPASS
    display_name: "&a&lTeleport to Spawn"
    lore:
      - "&7Click to teleport to main city"
      - ""
      - "&fInstantly teleport to safe main city"
      - "&farea, suitable for new players"
    left_click_commands:
      - "[player] spawn"
      - "[message] &aTeleported to main city!"

  # Example Item 3: Player Info
  player_info:
    slot: 14
    material: PLAYER_HEAD
    display_name: "&b&lPlayer Info"
    lore:
      - "&7View your personal information"
      - "&fMoney: &6%vault_eco_balance%"
    left_click_commands:
      - "[message] &6=== Player Info ==="
      - "[message] &fYour level is very high!"

  # Example Item 4: Shop
  shop:
    slot: 16
    material: EMERALD
    display_name: "&2&lShop System"
    lore:
      - "&7Open server shop"
    left_click_commands:
      - "[menu] shop"
      # [menu] = Directly open another menu file from this plugin (shop.yml)
      # Equivalent to dgm open shop

  # Example Item 6: Close Button
  close:
    slot: 49
    # Middle position of row 6 (45+4=49)
    material: BARRIER
    display_name: "&c&lClose Menu"
    lore:
      - "&7Click to close this menu"
    left_click_commands:
      - "[close]"
