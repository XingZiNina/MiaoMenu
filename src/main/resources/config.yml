# DO NOT CHANGE VERSION NUMBER!!!!!
config-version: 12 # config.yml version detection
menu-version: 3 # test.yml version detection
settings:
  open-menu-sound: # Sound configuration for opening menu
    enabled: true
    sound: "entity.experience_orb.pickup" # MC vanilla sound effect
    volume: 1.0 # Volume range 0.0-1.0
    pitch: 1.0 # Pitch range 0.5-2.0
  default-menu: "test" # Default menu to open (sync with filename, no extension needed)

  hot-reload:
    enabled: true # When file is saved, no need to enter reload, config automatically reloads
  auto-generate-examples: true # Auto-generate example files switch, only generates when not present

  # Proxy network configuration (supports BungeeCord and Velocity)
  velocity-network: true # Whether to enable Velocity network support (auto-detects BungeeCord)
  
  # CraftEngine custom item support
  craftengine:
    enabled: false # Whether to enable CraftEngine custom item support
    fallback-material: STONE # Fallback material when CraftEngine is not installed or item doesn't exist

  menu-clock:
    enabled: true # Whether to enable the entire clock feature
    give-on-join: true # Will check if clock already exists in inventory to avoid duplicate distribution

# Supports &R&G&B color format
messages:
  default-item-name: "&6Time Mirror &7(Right-click to open menu)"
  message:
    no-permission: "&c✦ Insufficient permissions, you cannot access this command."
    players-only: "&c✦ Only adventurers in the game (players) can use this command."
    menu-not-found: "&c✦ No menu named &e{0}&c found, please check spelling."
    error: "&c✦ Operation blocked, please check console to determine the cause."
    invalid-player: "&c✦ Player not found or they have gone offline."
    config-update-warning: "&e✦ Old config detected, attempting automatic migration..."
    reloaded: "&a✦ Configuration files updated, everything is ready."
    io-error: "&c✦ Writing blocked, cannot write on scroll (IO error), please check seal permissions (file permissions)."

  verbose:
    config-adding-key: "✦ Filling gaps, inscribing rules: {0}"
    config-keys-added: "✦ Scroll renewed, added {0} strokes total"

  help:
    header: "&6✿ &eHello there, traveler &6✿"
    usage: "&7✎ Hover for details, click to execute"

  descriptions:
    open: "&a✦ Open the specified magic scroll"
    reload: "&c✦ Let the core rules be renewed"
    help: "&e✦ Explore the guiding chapter of wisdom"

  command:
    unknown: "&c✦ The void does not respond to this unknown whisper, please check /dgm help."
    usage-open: "&c✦ Correct format for casting the spell: /dgm open <scroll_name>"

  open:
    error: "&c✦ Interface expansion failed, please check console logs."

  menu:
    clock:
      name: "&6Time Mirror &7(Right-click to open menu)"
      given: "&a✦ Time Mirror has been gifted, right-click to reflect the menu!"
      restored: "&f✦ Item has been returned to you intact."

  hot-reload:
    initialized: "✦ Menu rhythm has begun (hot reload activated)."
    detected: "✦ Fluctuation detected: {0}, reshaping menu..."
