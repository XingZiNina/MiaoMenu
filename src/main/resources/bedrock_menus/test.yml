# Bedrock Menu Example - Main Menu
menu:
  title: "§6§lMain Menu" # Title
  subtitle: "§7Welcome to the server!" # Top (actually not sure how to explain)
  footer: "§8Server Version 1.21.x" # Bottom (actually not sure how to explain)

  items: # Item list start
    - text: "§e§lServer Info\n§7Click to view server status" # Display name
      icon: "textures/items/book_enchanted" # Icon path (can use resource pack to create exclusive icons)
      icon_type: "path" # Options: PATH and URL. If URL, fill in image direct link in icon item. Best 32x32 64x64
      command: "" # Command to execute. Note: Can use %player% to replace player name
      execute_as: "player" # Options: player (player executes), cmd (console executes), message (send message), close (close menu)
      # All following items are the same. Please carefully create a special menu for your players!

    - text: "§a§lTeleportation\n§7Quick teleport to various locations"
      icon: "textures/items/compass_item"
      icon_type: "path"
      command: "dgeysermenu open warps"
      execute_as: "player"
    
    - text: "§b§lPlayer Info\n§7View your game data"
      icon: "textures/items/empty_armor_slot_helmet"
      icon_type: "path"
      command: "dgeysermenu open profile"
      execute_as: "player"

    - text: "§2§lShop System\n§7Buy and sell items"
      icon: "textures/items/emerald"
      icon_type: "path"
      command: "dgeysermenu open shop"
      execute_as: "player"

    - text: "§d§lQuest System\n§7View available quests"
      icon: "textures/items/book_normal"
      icon_type: "path"
      command: "quests"
      execute_as: "player"

    - text: "§c§lMinigames\n§7Participate in fun minigames"
      icon: "textures/items/diamond_sword"
      icon_type: "path"
      command: "games"
      execute_as: "player"

    - text: "§5§lFriends System\n§7Manage your friends list"
      icon: "textures/items/name_tag"
      icon_type: "path"
      command: "friends"
      execute_as: "player"

    - text: "§9§lHelp Info\n§7View server help"
      icon: "textures/items/paper"
      icon_type: "path"
      command: "help"
      execute_as: "player"
